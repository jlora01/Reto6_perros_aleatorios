<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1> Perros Aleatorios</h1>
    <p>Una imagen diferente cada vez que presionemos el botón</p>
  </header>

  <main class="tarjeta">
      <div class="marco">
      <div class="cargando" id="cargando"></div>
      <img id="foto" alt="Imagen aleatoria de un perro">
    </div>

    <p class="raza" id="raza"></p>
    <p class="error" id="error" role="alert"></p>

    <div class="controles">
      <select id="selectorRaza" aria-label="Elegir raza">
        <option value="">Todas las razas</option>
      </select>
      <button id="botonNuevo">Nueva imagen</button>
    </div>
  </main>

  <!-- Conecto mi JavaScript al final para que el HTML ya exista cuando el script lo busque -->
  <script src="script.js"></script>
</body>
</html>
